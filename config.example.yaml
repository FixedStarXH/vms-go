# 河南科技学院入校登记系统（ERS Go 版）配置示例
# 复制为 config.yaml 并填入真实值（config.yaml 已被 .gitignore 排除，不会上传）
server:
  port: 8081
  mode: debug

mysql:
  # 数据库连接串（替换为实际账号密码）
  dsn: "root:CHANGE_ME@tcp(127.0.0.1:3306)/ers_go?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

jwt:
  # 生产环境务必更换为随机长密钥
  secret: "CHANGE_ME_JWT_SECRET"
  access_expire_hours: 2
  refresh_expire_days: 7

app:
  # 上传文件根目录（静态资源挂载点，含 qrcode 子目录）
  upload_dir: "uploads"
  # 二维码图片输出目录（相对 upload_dir）
  qr_dir: "uploads/qrcode"
  # 二维码签名密钥（防伪，务必更换）
  qr_secret: "CHANGE_ME_QR_SECRET"
  # 爽约扫描间隔（分钟）：将过期未入校的已通过申请标记为爽约
  no_show_check_minutes: 10
  no_show:
    # 爽约规则：累计 3 次 → 拉黑 30 天
    max_count: 3
    blacklist_days: 30
