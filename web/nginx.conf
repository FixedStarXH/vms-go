# ERS 前端生产配置：托管 Vite 构建产物 + 反向代理 Go 后端
# 反代前缀与开发环境 vite.config.ts 的 proxy 保持一致（前端全部走同源相对路径）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 反向代理通用请求头（各 location 继承）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 带哈希指纹的静态资源（构建产物带版本号）→ 长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 API 反向代理（精确匹配后端前缀，避免误伤前端页面路由）----
    location /api/          { proxy_pass http://ers-server:8081; }
    location /sys/          { proxy_pass http://ers-server:8081; }
    location /uploads/      { proxy_pass http://ers-server:8081; }
    location /admin/application/ { proxy_pass http://ers-server:8081; }
    location /admin/monitor/     { proxy_pass http://ers-server:8081; }
    location /admin/visitor/     { proxy_pass http://ers-server:8081; }
    location /admin/record/      { proxy_pass http://ers-server:8081; }
    location /admin/user/        { proxy_pass http://ers-server:8081; }
    location /admin/manager/     { proxy_pass http://ers-server:8081; }
    location /admin/slot/        { proxy_pass http://ers-server:8081; }

    # ---- SPA 前端路由回退（/admin/audit、/admin/settings 等页面路由命中这里）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
